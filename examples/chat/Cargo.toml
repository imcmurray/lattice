[package]
name = "lattice-chat-example"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lattice: local demo (lattice-chat) + networked P2P chat CLI (lattice-net)."
publish = false

[lints]
workspace = true

[[bin]]
name = "lattice-chat"
path = "src/main.rs"

# `lattice-net` (src/bin/lattice-net.rs) is auto-discovered.

[dependencies]
lattice = { path = "../../crates/lattice", features = ["iroh", "storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
