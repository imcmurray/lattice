[package]
name = "lattice-identity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lattice: post-quantum hybrid keypair = identity (BIP39 + HKDF derived)."
publish = false

[lints]
workspace = true

[features]
default = ["pq"]
# Post-quantum half of the hybrid. On by default; CryptoSuite::Hybrid requires it.
pq = ["dep:ml-dsa", "dep:ml-kem", "dep:getrandom"]
# At-rest identity storage (OS keychain primary, age-encrypted file fallback).
# Off by default — pulls platform keychain + age deps; apps opt in.
storage = ["dep:keyring", "dep:age", "dep:rpassword", "dep:toml", "dep:serde", "dep:getrandom"]

[dependencies]
lattice-core = { path = "../lattice-core" }

# Classical primitives (deterministic byte constructors — no RNG needed).
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Derivation + identity hashing.
bip39 = { version = "2", features = ["rand"] }
hkdf = "0.13"
sha2 = "0.11"
blake3 = "1"
zeroize = "1"

# Post-quantum (optional, default-on). FIPS 204 / FIPS 203 (RustCrypto).
ml-dsa = { version = "0.1", optional = true }
ml-kem = { version = "0.3", optional = true }
getrandom = { version = "0.4", optional = true }

# At-rest storage (feature = "storage").
keyring = { version = "4", optional = true }
age = { version = "0.11", optional = true }
rpassword = { version = "7", optional = true }
toml = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
