[package]
name = "lattice-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lattice: Transport trait, in-memory loopback impl, and iroh QUIC backend."
publish = false

[lints]
workspace = true

[features]
default = []
# Networked QUIC backend (iroh). Off by default to keep core builds light.
iroh = ["dep:iroh", "dep:serde", "dep:postcard", "dep:hex", "tokio/io-util", "tokio/time"]

[dependencies]
lattice-core = { path = "../lattice-core" }
tokio = { version = "1", features = ["sync"] }
iroh = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }
