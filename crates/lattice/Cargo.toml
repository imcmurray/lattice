[package]
name = "lattice"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lattice: security-forward, 100% Rust peer-to-peer application framework."
publish = false

[lints]
workspace = true

[dependencies]
lattice-core = { path = "../lattice-core" }
lattice-identity = { path = "../lattice-identity" }
lattice-transport = { path = "../lattice-transport" }
lattice-session = { path = "../lattice-session" }
lattice-log = { path = "../lattice-log" }
lattice-caps = { path = "../lattice-caps" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
