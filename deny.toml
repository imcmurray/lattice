# cargo-deny — supply-chain gates (DESIGN.md §6.8). Run: `cargo deny check`.
[advisories]
yanked = "deny"
# Documented exceptions: unmaintained (NOT vulnerable) transitive crates with no
# upgrade path available. Real vulnerabilities — and any newly-flagged crate —
# still fail CI. Revisit and remove these as upstreams drop the dependencies.
ignore = [
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (transitive)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive; macro helper)
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained (transitive)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced by path with a "*" version; keep the
# wildcard ban for external crates but allow it for our own path deps.
allow-wildcard-paths = true

[licenses]
# All permissive / public-domain-equivalent. Unlicense + CC0-1.0 are common in
# the Rust ecosystem (e.g. tiny-keccak, notify); Zlib is a permissive BSD-alike.
allow = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0",
    "Unicode-3.0", "Unlicense", "CC0-1.0", "Zlib", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
